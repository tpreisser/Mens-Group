<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function() {
      var path = window.location.pathname;
      var basePath = path.includes('/Mens-Group/') ? '/Mens-Group/' : '/';
      window.BASE_PATH = basePath;
      
      // Write base tag first
      document.write('<base href="' + basePath + '">\n');
      
    (function() {
      var basePath = window.BASE_PATH || '/';
      var script = document.createElement('script');
      script.src = basePath + 'js/app.js?v=' + Date.now() + '&cb=' + Math.random();
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
  <script src="js/app.js"></script>
